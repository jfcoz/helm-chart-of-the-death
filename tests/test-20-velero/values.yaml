multiZone: false
cloudProvider: scw

general:
  clusterName: change-me
  ingressWildcardSuffix: replaced.by.kustomization
  grafanaAdminPassword: change_me
  fluxcd:
    release:
      # reduce interval to detect ClusterIssuer api capabilities after cert-manager installation
      interval: 1m
alerts:
  alertmanager_slack_webhook: https://example.com
  alertmanager_watchdog_webhook: https://example.com
  alertmanager_oncall_webhook: https://example.com

components:

  backup:
    velero:
      managed: true
      config:
        bucket: velero-bucket
        aws:
          region: fr-par
          endpoint: s3.fr-par.scw.cloud
        encryption:
          enabled: true
          secretName: test-secret
          keyName: test.key
      values:
        extraObjects:
        - apiVersion: v1
          kind: Secret
          metadata:
            name: cloud-credentials
          type: Opaque
          stringData:
            cloud: |
              [default]
              aws_access_key_id=test
              aws_secret_access_key=test
        - apiVersion: v1
          kind: Secret
          metadata:
            name: test-secret
          type: Opaque
          stringData:
            test.key: very_secret
