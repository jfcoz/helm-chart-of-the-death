# Source: datadog/templates/agent-clusterchecks-network-policy.yaml
apiVersion: "networking.k8s.io/v1"
kind: NetworkPolicy
metadata:
  name: datadog-clusterchecks
  namespace: infra-datadog
  labels:
    helm.sh/chart: 'datadog-3.193.0'
    app.kubernetes.io/name: "datadog"
    app.kubernetes.io/instance: "datadog"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: "7"
spec:
  podSelector:
    matchLabels:
      app: datadog-clusterchecks
  policyTypes:
    - Ingress
    - Egress
  egress:
    - # Egress to
      # * Datadog intake
      # * Kube API server
      ports:
        - port: 443
    - # Egress to cluster agent
      ports:
        - port: 5005
      to:
        - podSelector:
            matchLabels:
              app: datadog-cluster-agent

# The cluster check runners are susceptible to an issue connecting to
# any service that is annotated with auto-discovery annotations.
#
# When a user wants to add a check on such a service, they need to
# * annotate the service
# * add an ingress policy from the CLC on its own pod
# In order to not ask end-users to inject NetworkPolicy on the agent in
# the agent namespace, the agent must be allowed to probe any service.
    - {} # Egress to anything for service checks
---
# Source: datadog/templates/agent-network-policy.yaml
apiVersion: "networking.k8s.io/v1"
kind: NetworkPolicy
metadata:
  name: datadog
  namespace: infra-datadog
  labels:
    helm.sh/chart: 'datadog-3.193.0'
    app.kubernetes.io/name: "datadog"
    app.kubernetes.io/instance: "datadog"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: "7"
spec:
  podSelector:
    matchLabels:
      app: datadog
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - # Ingress for dogstatsd
      ports:
        - port: 8125
          protocol: UDP
  egress:
    - # Egress to
      # * Datadog intake
      # * Kube API server
      ports:
        - port: 443
# The agents are susceptible to an issue connecting to any pod that
# is annotated with auto-discovery annotations.
#
# When a user wants to add a check to such a pod, they need to
# * annotate the pod
# * add an ingress policy from the agent on its own pod
# In order to not ask end-users to inject NetworkPolicy on the agent in
# the agent namespace, the agent must be allowed to probe any pod.
    - {} # Egress to anything for checks
---
# Source: datadog/templates/cluster-agent-network-policy.yaml
apiVersion: "networking.k8s.io/v1"
kind: NetworkPolicy
metadata:
  name: datadog-cluster-agent
  namespace: infra-datadog
  labels:
    helm.sh/chart: 'datadog-3.193.0'
    app.kubernetes.io/name: "datadog"
    app.kubernetes.io/instance: "datadog"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: "7"
spec:
  podSelector:
    matchLabels:
      app: datadog-cluster-agent
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - # Ingress from the node agents (for the prometheus check)
      ports:
        - port: 5000
      from:
        - podSelector:
            matchLabels:
              app: datadog
    - # Ingress from node agents (for the metadata provider), other cluster agents and from cluster checks runner
      ports:
        - port: 5005
      from:
        - podSelector:
            matchLabels:
              app: datadog
        - podSelector:
            matchLabels:
              app: datadog-cluster-agent
    - ports:
        - port: 8000
  egress:
    - # Egress to other cluster agents
      ports:
        - port: 5005
      to:
        - podSelector:
            matchLabels:
              app: datadog-cluster-agent
    - # Egress to
      # * Datadog intake
      # * Kube API server
      # * DNS
      ports:
        - port: 443
        - port: 6443
        - port: 53
          protocol: UDP
