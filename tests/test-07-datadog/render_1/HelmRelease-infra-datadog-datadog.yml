---
# Source: helm-chart-of-the-death/templates/monitoring/datadog/helmrelease.yaml
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: datadog
  namespace: infra-datadog
  annotations:
    helm.sh/resource-policy: keep
spec:
  # include common.fluxcd.release
  install:
    crds: Create
    remediation:
      retries: 10
  interval: 1h
  test:
    enable: true
  timeout: 5m
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  chart:
    spec:
      chart: datadog
      # each major contains upgrade process in changelog
      version: "3.214.0"
      sourceRef:
        kind: HelmRepository
        name: "datadog"
        namespace: flux-system
      interval: 1h
  values:
    agents:
      containers:
        agent:
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
        processAgent:
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
        traceAgent:
          resources:
            requests:
              cpu: 30m
              memory: 100Mi
      priorityClassCreate: true
      priorityClassName: datadog
      tolerations:
        - operator: Exists
      updateStrategy:
        rollingUpdate:
          maxUnavailable: 50%
    clusterAgent:
      podAnnotations:
        cluster-autoscaler.kubernetes.io/safe-to-evict-local-volumes: datadogrun,varlog,tmpdir,config
      token: 4uftrVcbSdZL47LdGBvVNMO9G7xDoCAa
    datadog:
      apiKey: 0123456789abcdef0123456789abcdef
      apm:
        instrumentation:
          skipKPITelemetry: true
      clusterName: change-me
      containerExcludeLogs: image:gke.gcr.io/event-exporter
      env:
        - name: DD_LOGS_CONFIG_TAGGER_WARMUP_DURATION
          value: 60
        - name: DD_KUBERNETES_METADATA_TAG_UPDATE_FREQ
          value: 10
        - name: DD_TRACE_ENABLED
          value: 0
        - name: DD_CONTAINER_INCLUDE
          value: image:^bitnami/redis:.* image:^bitnami/rabbitmq:.*
        - name: DD_CONTAINER_EXCLUDE
          value: image:.* kube_namespace:.*
      kubelet:
        tlsVerify: true
      logLevel: ERROR
      logs:
        containerCollectAll: true
        enabled: true
      namespaceLabelsAsTags:
        environment: env
      networkPolicy:
        create: true
      operator:
        enabled: false
      podLabelsAsTags:
        app.kubernetes.io/name: app
      site: datadoghq.eu
