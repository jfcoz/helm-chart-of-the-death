---
# Source: helm-chart-of-the-death/templates/cni/cilium-scw-hubble/helmrelease.yaml
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium-scw-hubble
  namespace: kube-system
  annotations:
    helm.sh/resource-policy: keep
spec:
  # include common.fluxcd.release
  install:
    crds: Create
    remediation:
      retries: 10
  interval: 1h
  test:
    enable: true
  timeout: 10m
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  chart:
    spec:
      chart: scaleway-cilium-hubble
      # each major contains upgrade process in changelog
      version: "0.1.3"
      sourceRef:
        kind: HelmRepository
        name: "scaleway"
        namespace: flux-system
      interval: 1h
  values:
    hubble:
      export:
        dynamic:
          config:
            content:
              - fieldMask:
                  - time
                  - uuid
                  - verdict
                  - l7.http.code
                  - l7.http.method
                  - l7.http.url
                  - l7.http.protocol
                  - IP
                  - destination.pod_name
                  - source.pod_name
                  - l7.type
                  - l7.latency_ns
                  - l7.http.headers
                fileMaxBackups: 0
                fileMaxSizeMb: 2137
                filePath: /dev/stdout
                includeFilters:
                  - event_type:
                      - type: 129
                name: l7-http-stdout
            enabled: true
          enabled: true
