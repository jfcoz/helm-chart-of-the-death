---
# Source: helm-chart-of-the-death/templates/cni/cilium-scw-hubble/helmrelease.yaml
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: scaleway-cilium-hubble
  namespace: kube-system
  annotations:
    helm.sh/resource-policy: keep
spec:
  # include common.fluxcd.release
  install:
    crds: Create
    remediation:
      retries: 10
  interval: 1h
  test:
    enable: true
  timeout: 10m
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  chart:
    spec:
      chart: scaleway-cilium-hubble
      # each major contains upgrade process in changelog
      version: "0.1.3"
      sourceRef:
        kind: HelmRepository
        name: "scaleway"
        namespace: flux-system
      interval: 1h
  values: {}
