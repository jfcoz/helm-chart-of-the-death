---
# Source: helm-chart-of-the-death/templates/ingress/nginx-ingress-controller/helmrelease.yaml
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nginx-ingress
  namespace: infra-nginx-ingress
  annotations:
    helm.sh/resource-policy: keep
spec:
  # include common.fluxcd.release
  install:
    crds: Create
    remediation:
      retries: 10
  interval: 1h
  maxHistory: 3
  test:
    enable: true
  timeout: 30m
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  chart:
    spec:
      chart: ingress-nginx
      # each major contains upgrade process in changelog
      version: "4.15.1"
      sourceRef:
        kind: HelmRepository
        name: "kubernetes-ingress-nginx"
        namespace: flux-system
      interval: 1h
  values:
    controller:
      config: null
      externalTrafficPolicy: Local
      metrics:
        enabled: true
      resources:
        requests:
          memory: 300M
      service:
        externalTrafficPolicy: ""
        type: ClusterIP
    revisionHistoryLimit: 3
