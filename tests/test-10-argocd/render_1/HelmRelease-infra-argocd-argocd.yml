---
# Source: helm-chart-of-the-death/templates/gitops/argocd/helmrelease.yaml
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: argocd
  namespace: infra-argocd
  annotations:
    helm.sh/resource-policy: keep
spec:
  dependsOn:
    - name: cert-manager
      namespace: infra-cert-manager
    - name: cert-manager-cluster-issuer
      namespace: infra-cert-manager
  # include common.fluxcd.release
  install:
    crds: Create
    remediation:
      retries: 10
  interval: 1m
  test:
    enable: true
  timeout: 5m
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  chart:
    spec:
      chart: argo-cd
      # each major contains upgrade process in changelog
      version: "10.1.3"
      sourceRef:
        kind: HelmRepository
        name: "argo"
        namespace: flux-system
      interval: 1h
  values:
    applicationSet:
      metrics:
        enabled: false
      resources:
        requests:
          cpu: 2m
          memory: 20M
    configs:
      cm:
        dex.config: "connectors:\n- type: github\n  id: github\n  name: GitHub\n  config:\n    clientID: replace_by.github_client_id\n    clientSecret: replace_by.github_client_secret\n    orgs:\n    \n    - name: orgname\n      teams:\n      - team1\n      - team2\n"
        place_holder: never empty
    controller:
      metrics:
        enabled: false
      resources:
        requests:
          cpu: 5m
          memory: 40M
    dex:
      logLevel: debug
      metrics:
        enabled: false
      resources:
        requests:
          cpu: 2m
          memory: 100M
    global:
      domain: argocd.replaced.by.kustomization
    notifications:
      metrics:
        enabled: false
      resources:
        requests:
          cpu: 2m
          memory: 40M
    redis:
      metrics:
        enabled: false
      resources:
        requests:
          cpu: 2m
          memory: 20M
    repoServer:
      metrics:
        enabled: false
      resources:
        requests:
          cpu: 5m
          memory: 40M
    server:
      certificate:
        enabled: true
        issuer:
          group: cert-manager.io
          kind: ClusterIssuer
          name: self-signed
      httproute:
        enabled: true
        hostnames:
          - argocd.replaced.by.kustomization
        parentRefs:
          - group: gateway.networking.k8s.io
            kind: Gateway
            name: scaleway-gateway
            namespace: kube-system
            sectionName: https-prometheus
      ingress:
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt-production
          nginx.ingress.kubernetes.io/backend-protocol: HTTPS
        enabled: true
        ingressClassName: nginx
        tls: true
      ingressGrpc:
        enabled: true
        ingressClassName: nginx
        tls: true
      metrics:
        enabled: false
      resources:
        requests:
          cpu: 2m
          memory: 50M
