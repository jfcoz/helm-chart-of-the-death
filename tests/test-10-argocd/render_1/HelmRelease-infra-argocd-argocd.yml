---
# Source: helm-chart-of-the-death/templates/gitops/argocd/helmrelease.yaml
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: argocd
  namespace: infra-argocd
  annotations:
    helm.sh/resource-policy: keep
spec:
  # include common.fluxcd.release
  install:
    crds: Create
    remediation:
      retries: 10
  interval: 1h
  test:
    enable: true
  timeout: 30m
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  chart:
    spec:
      chart: argo-cd
      sourceRef:
        kind: HelmRepository
        name: "argo"
        namespace: default
      version: "9.4.10"
  values:
    applicationSet:
      metrics:
        enabled: false
    controller:
      metrics:
        enabled: false
    dex:
      metrics:
        enabled: false
    global:
      domain: argocd.replaced.by.kustomization
    notifications:
      metrics:
        enabled: false
    redis:
      metrics:
        enabled: false
    repoServer:
      metrics:
        enabled: false
    server:
      ingress:
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt-production
        enabled: true
        ingressClassName: nginx
      metrics:
        enabled: false
