---
# Source: helm-chart-of-the-death/templates/gitops/argocdImageUpdater/helmrelease.yaml
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: argocd-image-updater
  namespace: infra-argocd
  annotations:
    helm.sh/resource-policy: keep
spec:
  dependsOn:
    - name: cert-manager
      namespace: infra-cert-manager
    - name: cert-manager-cluster-issuer
      namespace: infra-cert-manager
  # include common.fluxcd.release
  install:
    crds: Create
    remediation:
      retries: 10
  interval: 1m
  test:
    enable: true
  timeout: 30m
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  chart:
    spec:
      chart: argocd-image-updater
      # each major contains upgrade process in changelog
      version: "1.2.2"
      sourceRef:
        kind: HelmRepository
        name: "argo"
        namespace: flux-system
      interval: 1h
  values:
    metrics:
      enabled: false
    resources:
      requests:
        cpu: 2m
        memory: 20M
