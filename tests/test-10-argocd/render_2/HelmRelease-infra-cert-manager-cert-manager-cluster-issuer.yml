---
# Source: custom-objects-only/templates/custom-objects.yaml
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-production
  namespace: infra-cert-manager
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-production
    solvers:
       - http01:
          ingress:
            class: nginx
---
# Source: custom-objects-only/templates/custom-objects.yaml
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
  namespace: infra-cert-manager
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-staging
    solvers:
       - http01:
          ingress:
            class: nginx
---
# Source: custom-objects-only/templates/custom-objects.yaml
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: self-signed
  namespace: infra-cert-manager
spec:
  selfSigned: {}
