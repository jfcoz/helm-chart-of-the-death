---
# Source: helm-chart-of-the-death/templates/database/cnpgPluginBarmanCloud/helmrelease.yaml
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cnpg-plugin-barman-cloud
  # must be the same namespace as cnpg operator
  namespace: cnpg-operator
  annotations:
    helm.sh/resource-policy: keep
spec:
  dependsOn:
    - name: cert-manager
      namespace: infra-cert-manager
  # include common.fluxcd.release
  install:
    crds: Create
    remediation:
      retries: 10
  interval: 1h
  test:
    enable: true
  timeout: 5m
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  chart:
    spec:
      chart: plugin-barman-cloud
      version: "0.5.0"
      sourceRef:
        kind: HelmRepository
        name: "cnpg"
        namespace: flux-system
      interval: 1h
  values: {}
