# Source: helm-chart-of-the-death/templates/cni/cilium/helmrelease.yaml
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: kube-system
  annotations:
    helm.sh/resource-policy: keep
spec:
  # include common.fluxcd.release
  install:
    crds: Create
    remediation:
      retries: 10
  interval: 1h
  test:
    enable: true
  timeout: 30m
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  chart:
    spec:
      chart: cilium
      sourceRef:
        kind: HelmRepository
        name: "cilium"
        namespace: flux-system
      version: "1.19.2"
  values:
    cluster:
      name: change-me
    envoy:
      updateStrategy:
        rollingUpdate:
          maxUnavailable: 33%
    ipam:
      operator:
        clusterPoolIPv4PodCIDRList:
          - 10.42.0.0/16
    k8sServiceHost: fake.domain.name
    k8sServicePort: 6443
    kubeProxyReplacement: true
    policyDenyResponse: icmp
    routingMode: tunnel
    tunnelProtocol: geneve
    updateStrategy:
      rollingUpdate:
        maxUnavailable: 33%
