---
# Source: helm-chart-of-the-death/templates/monitoring/k8s-monitoring/helmrelease.yaml
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: k8s-monitoring
  namespace: infra-k8s-monitoring
  annotations:
    helm.sh/resource-policy: keep
spec:
  dependsOn:
    - name: loki
      namespace: infra-loki
  # include common.fluxcd.release
  install:
    crds: Create
    remediation:
      retries: 10
  interval: 1h
  test:
    enable: true
  timeout: 5m
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  chart:
    spec:
      chart: k8s-monitoring
      version: "3.8.4"
      sourceRef:
        kind: HelmRepository
        name: "grafana"
        namespace: flux-system
      interval: 1h
  values:
    alloy-logs:
      alloy:
        securityContext:
          capabilities:
            add: []
      enabled: true
    alloy-metrics:
      enabled: true
    alloy-singleton:
      alloy:
        securityContext:
          capabilities:
            add: []
      enabled: true
    cluster:
      name: change-me
    clusterEvents:
      enabled: true
    clusterMetrics:
      enabled: true
    destinationsMap:
      localLogs:
        type: loki
        url: http://loki.infra-loki:3100/loki/api/v1/push
      localPrometheus:
        type: prometheus
        url: http://prometheus-kube-prometheus-prometheus.infra-prometheus:9090
    nodeLogs:
      enabled: true
    podLogs:
      enabled: true
