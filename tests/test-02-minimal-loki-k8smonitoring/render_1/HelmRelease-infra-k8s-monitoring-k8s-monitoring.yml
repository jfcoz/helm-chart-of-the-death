---
# Source: helm-chart-of-the-death/templates/monitoring/k8s-monitoring/helmrelease.yaml
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: k8s-monitoring
  namespace: infra-k8s-monitoring
  annotations:
    helm.sh/resource-policy: keep
spec:
  dependsOn:
    - name: loki
      namespace: infra-loki
  # include common.fluxcd.release
  install:
    crds: Create
    remediation:
      retries: 10
  interval: 1h
  test:
    enable: true
  timeout: 5m
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  chart:
    spec:
      chart: k8s-monitoring
      version: "4.1.1"
      sourceRef:
        kind: HelmRepository
        name: "grafana"
        namespace: flux-system
      interval: 1h
  values:
    cluster:
      name: change-me
    clusterEvents:
      collector: alloy-singleton
      enabled: true
    clusterMetrics:
      collector: alloy-metrics
      enabled: true
      kube-state-metrics:
        labelMatchers:
          app.kubernetes.io/name: kube-state-metrics
        namespace: infra-prometheus
    collectors:
      alloy-logs:
        alloy:
          mounts:
            varlog: true
          securityContext:
            capabilities:
              add: []
        controller:
          tolerations:
            - operator: Exists
          type: daemonset
        enabled: true
      alloy-metrics:
        alloy:
          clustering:
            enabled: true
        controller:
          type: deployment
        enabled: true
      alloy-singleton:
        alloy:
          securityContext:
            capabilities:
              add: []
        controller:
          type: deployment
        enabled: true
    destinations:
      localLogs:
        type: loki
        url: http://loki.infra-loki:3100/loki/api/v1/push
      localPrometheus:
        type: prometheus
        url: http://prometheus-kube-prometheus-prometheus.infra-prometheus:9090/api/v1/write
    nodeLogs:
      collector: alloy-logs
      enabled: true
    podLogsViaLoki:
      collector: alloy-logs
      enabled: true
