general:
  clusterName: change-me
  grafanaAdminPassword: change_me

  dnsWildcardSuffixes:
    ingress:
      nginx: replaced.by.kustomization
    gateway:
      cilium: replaced.by.kustomization

alerts:
  alertmanager_slack_webhook: https://example.com
  alertmanager_watchdog_webhook: https://example.com
  alertmanager_oncall_webhook: https://example.com

components:
  monitoring:
    loki:
      managed: true
      config:
        deploymentMode: SingleBinary
      values:
        loki:
          compactor:
            # retention needs delete_request_store but 404
            retention_enabled: false
        minio:
          enabled: true

    promtail:
      managed: true
