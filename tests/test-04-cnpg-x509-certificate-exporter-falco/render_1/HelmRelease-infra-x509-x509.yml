---
# Source: helm-chart-of-the-death/templates/monitoring/x509-certificate-exporter/helmrelease.yaml
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: x509
  namespace: infra-x509
  annotations:
    helm.sh/resource-policy: keep
spec:
  # include common.fluxcd.release
  install:
    crds: Create
    remediation:
      retries: 10
  interval: 1h
  test:
    enable: false
  timeout: 10m
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  chart:
    spec:
      chart: x509-certificate-exporter
      version: "3.19.1"
      sourceRef:
        kind: HelmRepository
        name: "enix"
        namespace: flux-system
      interval: 1h
  values:
    prometheusRules:
      create: false
    prometheusServiceMonitor:
      create: false
    secretsExporter:
      cache:
        maxDuration: 600
      resources:
        limits:
          cpu: 1000m
