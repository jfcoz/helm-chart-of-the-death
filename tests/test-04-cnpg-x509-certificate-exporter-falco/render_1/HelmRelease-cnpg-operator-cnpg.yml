---
# Source: helm-chart-of-the-death/templates/database/cnpg/helmrelease.yaml
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cnpg
  namespace: cnpg-operator
  annotations:
    helm.sh/resource-policy: keep
spec:
  #dependsOn:
  #  - name: prometheus
  #    namespace: infra-prometheus
  # include common.fluxcd.release
  install:
    crds: Create
    remediation:
      retries: 10
  interval: 1h
  test:
    enable: false
  timeout: 5m
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  chart:
    spec:
      chart: cloudnative-pg
      # each major contains upgrade process in changelog
      version: "0.28.2"
      sourceRef:
        kind: HelmRepository
        name: "cnpg"
        namespace: flux-system
      interval: 1h
  values:
    config:
      data:
        EXPIRING_CHECK_THRESHOLD: "30"
