---
# Source: helm-chart-of-the-death/templates/security/falco/helmrelease.yaml
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: falco
  namespace: infra-falco
  annotations:
    helm.sh/resource-policy: keep
spec:
  # include common.fluxcd.release
  install:
    crds: Create
    remediation:
      retries: 10
  interval: 1h
  test:
    enable: false
  timeout: 10m
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  chart:
    spec:
      chart: falco
      # each major contains upgrade process in changelog
      version: "8.0.5"
      sourceRef:
        kind: HelmRepository
        name: "falcosecurity"
        namespace: flux-system
      interval: 1h
  values:
    collectors:
      containerd:
        enabled: true
        socket: /run/k3s/containerd/containerd.sock
      kubernetes:
        enabled: true
    controller:
      daemonset:
        updateStrategy:
          rollingUpdate:
            maxUnavailable: 50%
    customRules:
      default-rules-exclusions.yaml: |-

        # Macro k8s_containers:
        # fluxcd
        - macro: k8s_containers
          override:
            condition: append
          condition: |
            or (
              k8s.ns.name = "flux-system"
              and container.image.repository in (
                ghcr.io/fluxcd/helm-controller,
                ghcr.io/fluxcd/kustomize-controller,
                ghcr.io/fluxcd/notification-controller,
                ghcr.io/fluxcd/source-controller
              )
            )
        - macro: k8s_containers
          override:
            condition: append
          condition: |
            or (
              k8s.ns.name = "infra-x509"
              and container.image.repository in (
                enix/x509-certificate-exporter,
                docker.io/enix/x509-certificate-exporter
              )
            )
        - macro: k8s_containers
          override:
            condition: append
          condition: |
            or (
              k8s.ns.name = "cnpg-operator"
              and container.image.repository in (
                ghcr.io/cloudnative-pg/cloudnative-pg,
                ghcr.io/cloudnative-pg/plugin-barman-cloud
              )
            )
        # condition not needed for ourself
        - macro: k8s_containers
          override:
            condition: append
          condition: |
            or (
              k8s.ns.name = "infra-falco"
              and container.image.repository in (
                falcosecurity/k8s-metacollector,
                docker.io/falcosecurity/k8s-metacollector
              )
            )



        # list allowed_container_images_loading_kernel_module
    driver:
      loader:
        initContainer:
          resources:
            requests:
              memory: 35M
    falcoctl:
      artifact:
        follow:
          resources:
            requests:
              cpu: 1m
              memory: 35M
        install:
          resources:
            requests:
              memory: 35M
    falcosidekick:
      config:
        alertmanager:
          endpoint: /api/v2/alerts
          hostport: http://prometheus-kube-prometheus-alertmanager.infra-prometheus:9093
          minimumpriority: notice
        customfields: cluster_name:change-me
      enabled: true
      resources:
        requests:
          cpu: 2m
          memory: 70M
      webui:
        enabled: true
        initContainer:
          resources:
            requests:
              memory: 10M
        redis:
          customConfig:
            - maxmemory-policy allkeys-lfu
            - maxmemory 30mb
          podLabels:
            velero.io/exclude-from-backup: "true"
          resources:
            limits:
              memory: 300M
            requests:
              cpu: 5m
              memory: 300M
        replicaCount: 1
        resources:
          requests:
            cpu: 2m
            memory: 20M
    k8s-metacollector:
      resources:
        requests:
          cpu: 5m
          memory: 50M
    metrics:
      enabled: true
    podPriorityClassName: system-node-critical
    resources:
      requests:
        cpu: 100m
        memory: 150M
    serviceMonitor:
      create: false
    tolerations:
      - effect: NoSchedule
        key: master
        operator: Exists
      - effect: NoSchedule
        key: storage
        operator: Exists
    tty: false
