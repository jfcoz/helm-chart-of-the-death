      - name: clean-cilium-state
        image: "quay.io/cilium/cilium:v1.19.5@sha256:20fbbc14ac20b55a292c0dcda5571bf31cde30a7dbc68c29db3e709390ab0732"
        imagePullPolicy: IfNotPresent
        command:
        - /init-container.sh
