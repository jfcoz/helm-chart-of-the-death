---
# Source: helm-chart-of-the-death/templates/cni/cilium/helmrelease.yaml
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: kube-system
  annotations:
    helm.sh/resource-policy: keep
spec:
  # include common.fluxcd.release
  install:
    crds: Create
    disableSchemaValidation: true
    remediation:
      retries: 10
  interval: 1h
  test:
    enable: false
  timeout: 30m
  upgrade:
    crds: CreateReplace
    disableSchemaValidation: true
    remediation:
      retries: 3
  chart:
    spec:
      chart: cilium
      # each major contains upgrade process in changelog
      version: "1.19.4"
      sourceRef:
        kind: HelmRepository
        name: "cilium"
        namespace: flux-system
      interval: 1h
  values:
    apiRateLimit: endpoint-create=auto-adjust:true,mean-over:25,endpoint-delete=auto-adjust:true,mean-over:25
    cluster:
      name: change-me
    defaultLBServiceIPAM: none
    gatewayAPI:
      enabled: true
    ipam:
      operator:
        clusterPoolIPv4PodCIDRList:
          - 10.42.0.0/16
    k8sServiceHost: fake.domain.name
    k8sServicePort: 6443
    kubeProxyReplacement: true
    operator:
      rollOutPods: true
    policyDenyResponse: icmp
    rollOutCilliumPods: true
    routingMode: tunnel
    tunnelProtocol: geneve
