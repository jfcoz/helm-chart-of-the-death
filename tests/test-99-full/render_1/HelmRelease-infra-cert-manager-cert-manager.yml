---
# Source: helm-chart-of-the-death/templates/security/cert-manager/helmrelease.yaml
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: infra-cert-manager
  annotations:
    helm.sh/resource-policy: keep
spec:
  # include common.fluxcd.release
  install:
    crds: Create
    remediation:
      retries: 10
  interval: 1h
  test:
    enable: false
  timeout: 5m
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  chart:
    spec:
      chart: cert-manager
      # each major contains upgrade process in changelog
      version: "v1.20.2"
      sourceRef:
        kind: HelmRepository
        name: "jetstack"
        namespace: flux-system
      interval: 1h
  values:
    cainjector:
      resources:
        requests:
          cpu: 2m
          memory: 170Mi
    config:
      enableGatewayAPI: true
    installCRDs: true
    resources:
      requests:
        cpu: 3m
        memory: 150Mi
    webhook:
      resources:
        requests:
          cpu: 1m
          memory: 30Mi
