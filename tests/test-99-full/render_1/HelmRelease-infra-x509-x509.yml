---
# Source: helm-chart-of-the-death/templates/monitoring/x509-certificate-exporter/helmrelease.yaml
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: x509
  namespace: infra-x509
  annotations:
    helm.sh/resource-policy: keep
spec:
  dependsOn:
    - name: prometheus
      namespace: infra-prometheus
  # include common.fluxcd.release
  install:
    crds: Create
    remediation:
      retries: 10
  interval: 1h
  maxHistory: 3
  test:
    enable: false
  timeout: 10m
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  chartRef:
    kind: OCIRepository
    name: "enix-x509-certificate-exporter"
    namespace: flux-system
  values:
    hostPathsExporter:
      daemonSets:
        masters:
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: node-role.kubernetes.io/control-plane
                        operator: In
                        values:
                          - "true"
          tolerations:
            - effect: NoSchedule
              key: master
              operator: Exists
          watchDirectories:
            - /var/lib/rancher/k3s/server/tls/
            - /var/lib/rancher/k3s/agent/
        nodes:
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: node-role.kubernetes.io/control-plane
                        operator: NotIn
                        values:
                          - "true"
          tolerations:
            - effect: NoSchedule
              key: storage
              operator: Exists
          watchDirectories:
            - /var/lib/rancher/k3s/agent/
      resources:
        limits:
          cpu: 1000m
          memory: 30M
        requests:
          cpu: 1m
          memory: 30M
    prometheusRules:
      create: true
    prometheusServiceMonitor:
      create: true
    secretsExporter:
      cache:
        maxDuration: 600
      resources:
        limits:
          cpu: 1000m
      revisionHistoryLimit: 3
