---
# Source: helm-chart-of-the-death/templates/gitops/argocd/helmrelease.yaml
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: argocd
  namespace: infra-argocd
  annotations:
    helm.sh/resource-policy: keep
spec:
  dependsOn:
    - name: cert-manager
      namespace: infra-cert-manager
    - name: cert-manager-cluster-issuer
      namespace: infra-cert-manager
  # include common.fluxcd.release
  install:
    crds: Create
    disableSchemaValidation: true
    remediation:
      retries: 10
  interval: 1h
  test:
    enable: false
  timeout: 5m
  upgrade:
    crds: CreateReplace
    disableSchemaValidation: true
    remediation:
      retries: 3
  chart:
    spec:
      chart: argo-cd
      sourceRef:
        kind: HelmRepository
        name: "argo"
        namespace: flux-system
      version: "9.4.14"
  values:
    applicationSet:
      metrics:
        enabled: true
        serviceMonitor:
          enabled: true
    configs:
      cm:
        place_holder: never empty
    controller:
      metrics:
        enabled: true
        serviceMonitor:
          enabled: true
    dex:
      enabled: false
      logLevel: debug
      metrics:
        enabled: true
        serviceMonitor:
          enabled: true
    global:
      domain: argocd.replaced.by.kustomization
    notifications:
      metrics:
        enabled: true
        serviceMonitor:
          enabled: true
    redis:
      metrics:
        enabled: true
        serviceMonitor:
          enabled: true
    repoServer:
      metrics:
        enabled: true
        serviceMonitor:
          enabled: true
    server:
      certificate:
        enabled: true
        issuer:
          group: cert-manager.io
          kind: ClusterIssuer
          name: letsencrypt-production
      ingress:
        annotations:
          nginx.ingress.kubernetes.io/backend-protocol: HTTPS
        enabled: true
        ingressClassName: nginx
        tls: true
      ingressGrpc:
        enabled: true
        ingressClassName: nginx
        tls: true
      metrics:
        enabled: true
        serviceMonitor:
          enabled: true
