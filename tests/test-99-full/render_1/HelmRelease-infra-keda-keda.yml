---
# Source: helm-chart-of-the-death/templates/monitoring/keda/helmrelease.yaml
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: keda
  namespace: infra-keda
  annotations:
    helm.sh/resource-policy: keep
spec:
  dependsOn:
    - name: thanos
      namespace: infra-thanos
  # include common.fluxcd.release
  install:
    crds: Create
    disableSchemaValidation: true
    remediation:
      retries: 10
  interval: 1h
  test:
    enable: false
  timeout: 5m
  upgrade:
    crds: CreateReplace
    disableSchemaValidation: true
    remediation:
      retries: 3
  chart:
    spec:
      chart: keda
      # each major contains upgrade process in changelog
      version: "2.19.0"
      sourceRef:
        kind: HelmRepository
        name: "kedacore"
        namespace: flux-system
  values:
    prometheus:
      metricServer:
        enabled: true
        podMonitor:
          enabled: true
        serviceMonitor:
          enabled: true
      operator:
        enabled: true
        podMonitor:
          enabled: true
        prometheusRules:
          enabled: true
        serviceMonitor:
          enabled: true
      webhooks:
        enabled: true
        prometheusRules:
          enabled: true
        serviceMonitor:
          enabled: true
