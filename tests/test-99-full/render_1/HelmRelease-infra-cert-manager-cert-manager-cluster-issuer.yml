---
# Source: helm-chart-of-the-death/templates/security/cert-manager/helmrelease-clusterissuer.yaml
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager-cluster-issuer
  namespace: infra-cert-manager
  annotations:
    helm.sh/resource-policy: keep
spec:
  # include common.fluxcd.release
  install:
    crds: Create
    remediation:
      retries: 10
  interval: 1h
  test:
    enable: false
  timeout: 5m
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  dependsOn:
    - name: cert-manager
      namespace: infra-cert-manager
  chart:
    spec:
      chart: custom-objects-only
      sourceRef:
        kind: OCIRepository
        name: custom-objects-only
        namespace: flux-system
  values:
    clusterissuer-letsencrypt-staging: |
      apiVersion: cert-manager.io/v1
      kind: ClusterIssuer
      metadata:
        name: letsencrypt-staging
        namespace: infra-cert-manager
      spec:
        acme:
          server: https://acme-staging-v02.api.letsencrypt.org/directory
          privateKeySecretRef:
            name: letsencrypt-staging
          solvers:
             - http01:
                ingress:
                  class: nginx
    clusterissuer-letsencrypt-production: |
      apiVersion: cert-manager.io/v1
      kind: ClusterIssuer
      metadata:
        name: letsencrypt-production
        namespace: infra-cert-manager
      spec:
        acme:
          server: https://acme-v02.api.letsencrypt.org/directory
          privateKeySecretRef:
            name: letsencrypt-production
          solvers:
             - http01:
                ingress:
                  class: nginx
