---
# Source: helm-chart-of-the-death/templates/security/external-secrets/helmrelease.yaml
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets
  namespace: infra-external-secrets
  annotations:
    helm.sh/resource-policy: keep
spec:
  # include common.fluxcd.release
  install:
    crds: Create
    remediation:
      retries: 10
  interval: 1h
  maxHistory: 3
  test:
    enable: false
  timeout: 5m
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  chart:
    spec:
      chart: external-secrets
      # each major contains upgrade process in changelog
      version: "2.7.0"
      sourceRef:
        kind: HelmRepository
        name: "external-secrets"
        namespace: flux-system
      interval: 1h
  values:
    certController:
      resources:
        requests:
          cpu: 5m
          memory: 32M
      revisionHistoryLimit: 3
    grafanaDashboard:
      enabled: true
    log:
      level: warn
    resources:
      requests:
        cpu: 5m
        memory: 32M
    revisionHistoryLimit: 3
    serviceMonitor:
      enabled: true
    webhook:
      resources:
        requests:
          cpu: 5m
          memory: 32M
      revisionHistoryLimit: 3
