---
# Source: helm-chart-of-the-death/templates/monitoring/datadog/helmrelease.yaml
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: datadog
  namespace: infra-datadog
  annotations:
    helm.sh/resource-policy: keep
spec:
  dependsOn:
    - name: loki
      namespace: infra-loki
    - name: kyverno
      namespace: infra-kyverno
  # include common.fluxcd.release
  install:
    crds: Create
    disableSchemaValidation: true
    remediation:
      retries: 10
  interval: 1h
  test:
    enable: false
  timeout: 5m
  upgrade:
    crds: CreateReplace
    disableSchemaValidation: true
    remediation:
      retries: 3
  chart:
    spec:
      chart: datadog
      version: "3.193.0"
      sourceRef:
        kind: HelmRepository
        name: "datadog"
        namespace: flux-system
      interval: 1h
  values:
    agents:
      containers:
        agent:
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
        processAgent:
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
        traceAgent:
          resources:
            requests:
              cpu: 30m
              memory: 100Mi
      priorityClassCreate: true
      priorityClassName: datadog
      tolerations:
        - operator: Exists
      updateStrategy:
        rollingUpdate:
          maxUnavailable: 50%
    clusterAgent:
      token: 4uftrVcbSdZL47LdGBvVNMO9G7xDoCAa
    datadog:
      apiKey: 0123456789abcdef0123456789abcdef
      apm:
        instrumentation:
          skipKPITelemetry: true
      clusterName: change-me
      containerExcludeLogs: image:gke.gcr.io/event-exporter
      env:
        - name: DD_LOGS_CONFIG_TAGGER_WARMUP_DURATION
          value: 60
        - name: DD_KUBERNETES_METADATA_TAG_UPDATE_FREQ
          value: 10
        - name: DD_TRACE_ENABLED
          value: 0
      kubelet:
        tlsVerify: true
      logLevel: ERROR
      logs:
        containerCollectAll: false
        enabled: false
      networkPolicy:
        create: true
      operator:
        enabled: false
      site: datadoghq.eu
