---
# Source: helm-chart-of-the-death/templates/monitoring/thanos/helmrelease.yaml
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: thanos
  namespace: infra-thanos
  annotations:
    helm.sh/resource-policy: keep
spec:
  #dependsOn:
  #  # cannot depend of prometheus, prometheus depends on thanos
  #  - name: prometheus
  #    namespace: infra-prometheus
  # include common.fluxcd.release
  install:
    crds: Create
    remediation:
      retries: 10
  interval: 1h
  test:
    enable: false
  timeout: 5m
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  chart:
    spec:
      chart: thanos
      version: "1.23.0"
      sourceRef:
        kind: HelmRepository
        name: "stevehipwell"
        namespace: default
      interval: 1h
  values:
    compact:
      enabled: true
      persistence:
        enabled: true
        storageClass: ceph-block
      podLabels:
        velero.io/exclude-from-backup: "true"
    objstoreConfig:
      value: |-
        type: S3
        config:
          bucket: thanos-bucket
          endpoint: rook-ceph-rgw-ceph-objectstore.rook-ceph.svc
          region: rook
          access_key: {{ (((lookup "v1" "Secret" "infra-thanos" "thanos-bucket").data).AWS_ACCESS_KEY_ID) | default "QnVja2V0U2VjcmV0Tm90QXZhaWxhYmxlWWV0" | b64dec }}
          secret_key: {{ (((lookup "v1" "Secret" "infra-thanos" "thanos-bucket").data).AWS_SECRET_ACCESS_KEY) | default "QnVja2V0U2VjcmV0Tm90QXZhaWxhYmxlWWV0" | b64dec }}
          insecure: true
    receiver:
      ingestor:
        persistence:
          enabled: true
          storageClass: ceph-block
    rule:
      persistence:
        enabled: true
        storageClass: ceph-block
    storeGateway:
      persistence:
        enabled: true
        storageClass: ceph-block
      podLabels:
        velero.io/exclude-from-backup: "true"
