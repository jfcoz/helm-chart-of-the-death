multiZone: false

general:
  clusterName: change-me
  grafanaAdminPassword: change_me

  dnsWildcardSuffixes:
    ingress:
      nginx: replaced.by.kustomization
    gateway:
      cilium: replaced.by.kustomization

alerts:
  alertmanager_slack_webhook: https://example.com
  alertmanager_watchdog_webhook: https://example.com
  alertmanager_oncall_webhook: https://example.com

components:
  security:
    kyverno:
      managed: true
      values:
        admissionController:
          # only one for tests in kind
          replicas: 1
      policiesValues:
        customPolicies:
        - apiVersion: policies.kyverno.io/v1
          kind: PolicyException
          metadata:
            name: custom-policy-exception-test
            namespace: infra-kyverno
            annotations:
              helm.sh/resource-policy: keep
          spec:
            policyRefs:
              - name: disallow-privileged-containers
                kind: ValidatingPolicy
              - name: disallow-host-namespaces
                kind: ValidatingPolicy
              - name: disallow-host-path
                kind: ValidatingPolicy
            matchConditions:
              - name: skip-by-namespace-and-app
                expression: "object.metadata.namespace == 'test-namespace' && object.metadata.labels['app.kubernetes.io/name'] == 'test'"

    falco:
      # only to test rules exclusions
      used: true
