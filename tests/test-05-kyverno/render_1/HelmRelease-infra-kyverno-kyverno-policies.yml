---
# Source: helm-chart-of-the-death/templates/security/kyverno/helmrelease-policies.yaml
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno-policies
  namespace: infra-kyverno
  annotations:
    helm.sh/resource-policy: keep
spec:
  dependsOn:
    - name: kyverno
      namespace: infra-kyverno
  # include common.fluxcd.release
  install:
    crds: Create
    remediation:
      retries: 10
  interval: 1h
  test:
    enable: true
  timeout: 10m
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  chart:
    spec:
      chart: kyverno-policies
      # each major contains upgrade process in changelog
      version: "3.6.2"
      sourceRef:
        kind: HelmRepository
        name: "kyverno"
        namespace: flux-system
      interval: 1h
  values:
    admissionController:
      replicas: 1
    debug:
      - disallow-host-ports
      - disallow-privileged-containers
      - disallow-selinux
      - restrict-seccomp
      - restrict-sysctls
      - disallow-capabilities
      - disallow-host-namespaces
      - disallow-host-path
    failurePolicy: Ignore
    policyExclude:
      disallow-host-path:
        any:
          - resources:
              kinds:
                - Pod
              names:
                - falco-*
                - infra-falco-falco-*
              namespaces:
                - infra-falco
      disallow-privileged-containers:
        any:
          - resources:
              kinds:
                - Pod
              names:
                - falco-*
                - infra-falco-falco-*
              namespaces:
                - infra-falco
    validationFailureAction: Enforce
