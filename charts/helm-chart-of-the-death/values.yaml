    thanos:
      namespace: infra-thanos
      managed: false
      used: false
      helmResourcePolicyKeep: true
      chart:
        name: thanos
        version: "1.23.1"
        repository: stevehipwell
      excludeFromBackup: true
      release:
        timeout: 5m
      values: {}

    loki:
      namespace: infra-loki
