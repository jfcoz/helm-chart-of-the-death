      managed: false
      used: false
      helmResourcePolicyKeep: true
      namespace: infra-nginx-ingress
      chart:
        name: ingress-nginx
        version: "4.15.1"
        repository: kubernetes-ingress-nginx
      release:
        timeout: 30m
      values: {}

  monitoring:
