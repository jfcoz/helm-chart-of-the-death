# cloudProvider aws/gcp/ovh/scw (Scaleway)/do (Digital Ocean)/none
cloudProvider: none
multiZone: true

# kind/k3s
kubernetesDistribution: none

general:
  clusterName: change-me
  # contactAddress: replaced.by.kustomization
  # grafanaAdminPassword: must.be.replaced.by.kustomization
  # clusterName: must.be.replaced.by.kustomization

  # each ingress/loadbalancer entrypoint should have a *.cluster.example.com DNS record
  # dnsWildcardSuffixes:
  #   ingress:
  #     nginx: replaced.by.kustomization
  #   gateway:
  #     cilium: replaced.by.kustomization

  kubernetesApi:
    # host: replaced.by.kustomization
    port: 6443

  # on cloud providers with small ETCD quotas, it help to reduce database size by keeping less history of each application
  revisionHistoryLimit: 3

  fluxcd:
    release:
      interval: 1h
      timeout: 10m
      maxHistory: 3
      install:
        crds: Create
        remediation:
          retries: 10
      upgrade:
        crds: CreateReplace
        remediation:
          retries: 3
      test:
        enable: true

features:
  gatewayAPI:
    enabled: true
    type: experimental

repositories:
  - name: argo
    url: https://argoproj.github.io/argo-helm
  - name: cilium
    url: https://helm.cilium.io/
  - name: cnpg
    url: https://cloudnative-pg.github.io/charts
  - name: datadog
    url: https://helm.datadoghq.com
  - name: enix
    url: oci://quay.io/enix/charts
  - name: external-secrets
    url: https://charts.external-secrets.io
  - name: falcosecurity
    url: https://falcosecurity.github.io/charts
  - name: grafana
    url: https://grafana.github.io/helm-charts
  - name: grafana-community
    url: https://grafana-community.github.io/helm-charts
  - name: jetstack
    url: https://charts.jetstack.io
  - name: kedacore
    url: https://kedacore.github.io/charts
  - name: kubernetes-ingress-nginx
    url: https://kubernetes.github.io/ingress-nginx
  - name: kyverno
    url: https://kyverno.github.io/kyverno/
  - name: opentelemetry
    url: https://open-telemetry.github.io/opentelemetry-helm-charts
  - name: prometheus-community
    url: https://prometheus-community.github.io/helm-charts
  - name: scaleway
    url: https://helm.scw.cloud/
  - name: stevehipwell
    url: https://stevehipwell.github.io/helm-charts/
  - name: vmware-tanzu
    url: https://vmware-tanzu.github.io/helm-charts

components:

  cni:
    cilium:
      managed: false
      used: false
      helmResourcePolicyKeep: true
      namespace: kube-system
      chart:
        name: cilium
        version: "1.19.6"
        repository: cilium
      release:
        timeout: 30m
      values: {}

    # On Scaleway, Hubble must be deployed as an addon: https://www.scaleway.com/en/docs/tutorials/deploying-hubble-add-on-scaleway-kubernetes-clusters/
    ciliumScwHubble:
      managed: false
      used: false
      helmResourcePolicyKeep: true
      chart:
        name: scaleway-cilium-hubble
        version: "0.1.4"
        repository: scaleway

  gitops:
    argocd:
      managed: false
      used: false
      helmResourcePolicyKeep: true
      namespace: infra-argocd
      chart:
        name: argo-cd
        version: "10.6.3"
        repository: argo
      issuer: letsencrypt-production
      release:
        timeout: 5m
      dex_connectors: {}
        # github:
        #   client:
        #     # create oauth app from:
        #     # organization app: https://github.com/organizations/$org_name/settings/applications
