    falco:
      managed: false
      used: false
      helmResourcePolicyKeep: true
      namespace: infra-falco
      chart:
        name: falco
        version: "9.1.0"
        repository: falcosecurity
      excludeFromBackup: true
      release:
        timeout: 10m
        test:
          # test is using a very old mono arch image
          # https://github.com/falcosecurity/charts/blob/master/charts/falcosidekick/templates/tests/test-connection.yaml#L16
          enable: false
      config:
        alerts:
          # where to route falco alerts by priority
          emergency: critical_wakeup_oncall
          critical: critical_tomorrow_oncall
          others: falco_slack
      values: {}

    trivy:
      managed: false
      used: false
      helmResourcePolicyKeep: true
      namespace: infra-trivy
      chart:
        name: TODO
        version: "TODO"
        repository: TODO
      release:
        timeout: 10m
      values: {}

  audit:
    popeye:
      managed: false
      used: false
      helmResourcePolicyKeep: true
      namespace: infra-popeye

  storage:
    rook:
      managed: false
      used: false
      helmResourcePolicyKeep: true
      namespace: rook-ceph
      chart:
        version: "TODO"
        repository: TODO
      values: {}

  database:
