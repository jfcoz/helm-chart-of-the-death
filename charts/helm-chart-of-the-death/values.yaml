      managed: false
      used: false
      helmResourcePolicyKeep: true
      namespace: infra-velero
      chart:
        name: velero
        version: "12.1.0"
        repository: vmware-tanzu
      release:
        timeout: 10m
      config:
        # bucket: "change_me"
        # aws:
        #   roleArn: "change_me"
        #   region: "change_me"
        encryption:
          enabled: false
          secretName: velero-repo-encryption
          keyName: encryption.key
      values: {}

  security:
    certManager:
      managed: false
      used: false
      helmResourcePolicyKeep: true
      namespace: infra-cert-manager
      chart:
        name: cert-manager
        version: "v1.21.1"
        repository: jetstack
      release:
        timeout: 5m
      issuers:
        letsencrypt: true
        selfsigned: false
      values: {}

    externalSecrets:
      managed: false
      used: false
      helmResourcePolicyKeep: true
      namespace: infra-external-secrets
      chart:
        name: external-secrets
        version: "2.10.0"
