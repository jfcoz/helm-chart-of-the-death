{{- $me := .Values.components.security.certManager }}
{{- if include "common.managed" $me }}
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager-cluster-issuer
  namespace: {{ $me.namespace }}
  annotations:
    {{- if $me.helmResourcePolicyKeep }}
    helm.sh/resource-policy: keep
    {{- end }}
spec:
  # include common.fluxcd.release
  {{- include "common.fluxcd.release" (list $ $me) | nindent 2 }}
  dependsOn:
    - name: cert-manager
      namespace: {{ $me.namespace }}
  chart:
    spec:
      chart: custom-objects-only
      sourceRef:
        kind: OCIRepository
        name: custom-objects-only
        namespace: flux-system
  values:
    clusterissuer-letsencrypt-staging: |
      apiVersion: cert-manager.io/v1
      kind: ClusterIssuer
      metadata:
        name: letsencrypt-staging
        namespace: {{ $me.namespace }}
      spec:
        acme:
          server: https://acme-staging-v02.api.letsencrypt.org/directory
          {{- if (.Values.general).contactAddress }}
          email: {{ .Values.general.contactAddress | quote }}
          {{- end }}
          privateKeySecretRef:
            name: letsencrypt-staging
          solvers:
             - http01:
                ingress:
                  class: nginx
    clusterissuer-letsencrypt-production: |
      apiVersion: cert-manager.io/v1
      kind: ClusterIssuer
      metadata:
        name: letsencrypt-production
        namespace: {{ $me.namespace }}
      spec:
        acme:
          server: https://acme-v02.api.letsencrypt.org/directory
          {{- if (.Values.general).contactAddress }}
          email: {{ .Values.general.contactAddress | quote }}
          {{- end }}
          privateKeySecretRef:
            name: letsencrypt-production
          solvers:
             - http01:
                ingress:
                  class: nginx
{{- end }}
