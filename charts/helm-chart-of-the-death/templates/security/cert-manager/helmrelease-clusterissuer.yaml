{{- $me := .Values.components.security.certManager }}
{{- if include "common.managed" $me }}
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager-cluster-issuer
  namespace: {{ $me.namespace }}
  annotations:
    {{- if $me.helmResourcePolicyKeep }}
    helm.sh/resource-policy: keep
    {{- end }}
spec:
  dependsOn:
    - name: cert-manager
      namespace: {{ $me.namespace }}
  # include common.fluxcd.release
  {{- include "common.fluxcd.release" (list $ $me) | nindent 2 }}
  chartRef:
    kind: OCIRepository
    name: custom-objects-only
    namespace: {{ $.Release.Namespace }}
  values:
    customObjects:
      {{- if $me.issuers.letsencrypt }}
      clusterissuer-letsencrypt-staging: |
        apiVersion: cert-manager.io/v1
        kind: ClusterIssuer
        metadata:
          name: letsencrypt-staging
          namespace: {{ $me.namespace }}
        spec:
          acme:
            server: https://acme-staging-v02.api.letsencrypt.org/directory
            {{- if (.Values.general).contactAddress }}
            email: {{ .Values.general.contactAddress | quote }}
            {{- end }}
            privateKeySecretRef:
              name: letsencrypt-staging
            solvers:
               - http01:
                  ingress:
                    ingressClassName: nginx
      clusterissuer-letsencrypt-production: |
        apiVersion: cert-manager.io/v1
        kind: ClusterIssuer
        metadata:
          name: letsencrypt-production
          namespace: {{ $me.namespace }}
        spec:
          acme:
            server: https://acme-v02.api.letsencrypt.org/directory
            {{- if (.Values.general).contactAddress }}
            email: {{ .Values.general.contactAddress | quote }}
            {{- end }}
            privateKeySecretRef:
              name: letsencrypt-production
            solvers:
               - http01:
                  ingress:
                    ingressClassName: nginx
      {{- end }}
      {{- if $me.issuers.selfsigned }}
      clusterissuer-selfsigned: |
        apiVersion: cert-manager.io/v1
        kind: ClusterIssuer
        metadata:
          name: self-signed
          namespace: {{ $me.namespace }}
        spec:
          selfSigned: {}
      {{- end }}
{{- end }}
