{{- $me := .Values.components.security.kyverno }}
{{- if include "common.managed" $me }}
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno-policies
  namespace: {{ $me.namespace }}
  annotations:
    {{- if $me.helmResourcePolicyKeep }}
    helm.sh/resource-policy: keep
    {{- end }}
spec:
  dependsOn:
    - name: kyverno
      namespace: {{ $me.namespace }}
  # include common.fluxcd.release
  {{- include "common.fluxcd.release" (list $ $me) | nindent 2 }}
  # here we override the chart name
  {{- include "common.fluxcd.chartSpec" (list $ (mergeOverwrite $me (dict "chart" (dict "name" "kyverno-policies")))) | nindent 2 }}
  values:
    {{- include "security.kyverno.policies.mergedValues" . | nindent 4 }}
{{- end }}
