{{- $me := .Values.components.backup.velero }}
{{- if include "common.managed" $me }}
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: velero
  namespace: {{ $me.namespace }}
  annotations:
    {{- if $me.helmResourcePolicyKeep }}
    helm.sh/resource-policy: keep
    {{- end }}
spec:
  # include common.fluxcd.release
  {{- include "common.fluxcd.release" (list $ $me) | nindent 2 }}
  chart:
    spec:
      chart: {{ $me.chart.name }}
      # Don't forget to upgrade plugins when needed
      version: {{ $me.chart.version | quote }}
      sourceRef:
        kind: HelmRepository
        name: {{ $me.chart.repository | quote }}
        namespace: {{ $.Release.Namespace }}
      interval: 1h
  values:
    {{- include "backup.velero.mergedValues" . | nindent 4 }}
{{- end }}
