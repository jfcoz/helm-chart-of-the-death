{{- if .Values.features.gatewayAPI.enabled }}
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: crds-gateway-api
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  interval: 12h
  url: https://github.com/kubernetes-sigs/gateway-api
  ref:
    tag: v1.5.1
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: crds-gateway-api
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  interval: 1h
  prune: true
  sourceRef:
    kind: GitRepository
    name: gateway-api
    namespace: {{ .Release.Namespace }}
  path: "./config/crd/{{ .Values.features.gatewayAPI.type | default "standard" }}"
{{- end }}
