{{- $me := .Values.components.monitoring.openTelemetryOperator }}
{{- if include "common.managed" $me }}
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: opentelemetry
  namespace: {{ $me.namespace }}
  annotations:
    {{- if $me.helmResourcePolicyKeep }}
    helm.sh/resource-policy: keep
    {{- end }}
spec:
  # include common.fluxcd.release
  {{- include "common.fluxcd.release" (list $ $me) | nindent 2 }}
  {{- include "common.fluxcd.chartSpec" (list $ $me) | nindent 2 }}
  values:
    revisionHistoryLimit: {{ .Values.general.revisionHistoryLimit }}
    admissionWebhooks:
      certManager:
        enabled: true
      # Exclude system namespaces, cf https://cloud.google.com/kubernetes-engine/docs/how-to/optimize-webhooks?hl=fr#unsafe-webhooks
      namespaceSelector:
        matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            - kube-system
            - kube-node-lease
    manager:
      collectorImage:
        repository: "ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-k8s"
      serviceMonitor:
        enabled: true
      prometheusRule:
        enabled: true
      resources:
        requests:
          cpu: 5m
        limits:
          cpu: 500m
      #extraArgs:
      #  - --feature-gates=operator.autoinstrumentation.go
{{- end }}
