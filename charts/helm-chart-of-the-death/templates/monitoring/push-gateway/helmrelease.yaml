{{- $me := .Values.components.monitoring.pushGateway }}
{{- if include "common.managed" $me }}
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: push-gateway
  namespace: {{ $me.namespace }}
  annotations:
    {{- if $me.helmResourcePolicyKeep }}
    helm.sh/resource-policy: keep
    {{- end }}
spec:
  dependsOn:
    - name: prometheus
      namespace: {{ .Values.components.monitoring.kubePrometheusStack.namespace }}
  # include common.fluxcd.release
  {{- include "common.fluxcd.release" (list $ $me) | nindent 2 }}
  {{- include "common.fluxcd.chartSpec" (list $ $me) | nindent 2 }}
  values:
    serviceMonitor:
      enabled: true
      namespace: {{ $me.namespace }}
    networkPolicy:
      customSelectors:
        - namespaceSelector:
            matchLabels:
              network-policy-push-gateway: "true"
    persistentVolume:
      emptyDir:
        medium: Memory
{{- end }}
