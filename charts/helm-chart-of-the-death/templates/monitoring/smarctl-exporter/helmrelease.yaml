{{- $me := .Values.components.monitoring.smartctlExporter }}
{{- if include "common.managed" $me }}
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: smartctl
  namespace: {{ $me.namespace }}
  annotations:
    {{- if $me.helmResourcePolicyKeep }}
    helm.sh/resource-policy: keep
    {{- end }}
spec:
  dependsOn:
    - name: prometheus
      namespace: {{ .Values.components.monitoring.kubePrometheusStack.namespace }}
  # include common.fluxcd.release
  {{- include "common.fluxcd.release" (list $ $me) | nindent 2 }}
  {{- include "common.fluxcd.chartSpec" (list $ $me) | nindent 2 }}
  values:
    # until https://github.com/prometheus-community/smartctl_exporter/issues/105
    image:
      repository: ghcr.io/joryirving/smartctl_exporter
      tag: 0.14.0
    resources:
      requests:
        cpu: 10m
        memory: 40M
    serviceMonitor:
      enabled: true
    prometheusRules:
      enabled: true
    config:
      devices:
        - /dev/sda
{{- end }}
