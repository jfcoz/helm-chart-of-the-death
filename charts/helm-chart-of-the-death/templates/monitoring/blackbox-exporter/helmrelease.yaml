{{- $me := .Values.components.monitoring.blackboxExporter }}
{{- if include "common.managed" $me }}
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: blackbox
  namespace: {{ $me.namespace }}
  annotations:
    {{- if $me.helmResourcePolicyKeep }}
    helm.sh/resource-policy: keep
    {{- end }}
spec:
  dependsOn:
    - name: prometheus
      namespace: infra-prometheus
  # include common.fluxcd.release
  {{- include "common.fluxcd.release" (list $ $me) | nindent 2 }}
  {{- include "common.fluxcd.chartSpec" (list $ $me) | nindent 2 }}
  values:
    resources:
      requests:
        cpu: 10m
        memory: 25M
    serviceMonitor:
      enabled: true
      selfMonitor:
        enabled: true
    prometheusRule:
      enabled: true
      rules:
        - alert: HttpCodeNode200
          expr: avg by (namespace, instance) (probe_http_status_code!=200)
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: HTTP probe response code is not 200
            description: "HTTP probe response code {{ "{{" }} $value }} is not 200, on {{ "{{" }} $labels.instance }}"
{{- end }}
