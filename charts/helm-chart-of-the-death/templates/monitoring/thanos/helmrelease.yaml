{{- $me := .Values.components.monitoring.thanos }}
{{- if include "common.managed" $me }}
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: thanos
  namespace: {{ $me.namespace }}
  annotations:
    {{- if $me.helmResourcePolicyKeep }}
    helm.sh/resource-policy: keep
    {{- end }}
spec:
  #dependsOn:
  #  # cannot depend of prometheus, prometheus depends on thanos
  #  - name: prometheus
  #    namespace: {{ .Values.components.monitoring.kubePrometheusStack.namespace }}
  # include common.fluxcd.release
  {{- include "common.fluxcd.release" (list $ $me) | nindent 2 }}
  chart:
    spec:
      chart: {{ $me.chart.name }}
      version: {{ $me.chart.version | quote }}
      sourceRef:
        kind: HelmRepository
        name: {{ $me.chart.repository | quote }}
        namespace: {{ $.Release.Namespace }}
      interval: 1h
  values:
    {{- include "monitoring.thanos.mergedValues" . | nindent 4 }}
{{- end }}
