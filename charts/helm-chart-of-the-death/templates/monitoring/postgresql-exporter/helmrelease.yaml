{{- $me := .Values.components.monitoring.postgresqlExporter }}
{{- if include "common.managed" $me }}
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: postgresql-exporter
  namespace: {{ $me.namespace }}
  annotations:
    {{- if $me.helmResourcePolicyKeep }}
    helm.sh/resource-policy: keep
    {{- end }}
spec:
  {{- if or
           (include "common.used" .Values.components.monitoring.postgresqlExporter)
  }}
  dependsOn:
    {{- if include "common.used" .Values.components.monitoring.postgresqlExporter }}
    - name: prometheus
      namespace: infra-prometheus
    {{- end }}
  {{- end }}
  # include common.fluxcd.release
  {{- include "common.fluxcd.release" (list $ $me) | nindent 2 }}
  {{- include "common.fluxcd.chartSpec" (list $ $me) | nindent 2 }}
  values:
    {{- include "monitoring.postgresqlExporter.mergedValues" . | nindent 4 }}
{{- end }}
