{{- $me := .Values.components.gitops.argocdImageUpdater }}
{{- if include "common.managed" $me }}
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: argocd-image-updater
  namespace: {{ $me.namespace }}
  annotations:
    {{- if $me.helmResourcePolicyKeep }}
    helm.sh/resource-policy: keep
    {{- end }}
spec:
  {{- if include "common.used" .Values.components.security.certManager }}
  dependsOn:
    - name: cert-manager
      namespace: {{ .Values.components.security.certManager.namespace }}
    {{- if include "common.managed" .Values.components.security.certManager }}
    - name: cert-manager-cluster-issuer
      namespace: {{ .Values.components.security.certManager.namespace }}
    {{- end }}
  {{- end }}
  # include common.fluxcd.release
  {{- include "common.fluxcd.release" (list $ $me) | nindent 2 }}
  {{- include "common.fluxcd.chartSpec" (list $ $me) | nindent 2 }}
  values:
    {{- include "gitops.argocdImageUpdater.mergedValues" . | nindent 4 }}
{{- end }}
